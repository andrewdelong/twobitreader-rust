<style>
  /*
  Custom CSS to finesse the font sizes of inline code and block-formatted code.
  To build docs with this CSS, first build all docs (including those of dependencies)
  as usual, then separately build the docs for this crate with --html-in-header:

    $ cargo doc
    $ RUSTDOCFLAGS="--html-in-header doc/header.html" cargo doc --no-deps 

  */

  body {
    font-family: sans-serif;
  }

  /* inline code (` `) */
  code {
    font-size: 0.84em;
  }

  /* block formatted code (``` ```)*/
  pre {
    padding: 8px;
    line-height: 1.25;
  }

  pre code {
    font-size: 0.85em;
  }
</style>
