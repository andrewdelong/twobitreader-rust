version: 2.1

orbs:
  windows: circleci/windows@5

jobs:
  build-linux-x86:
    resource_class:
      large
    docker:
      - image: cimg/rust:1.98
    steps:
      - checkout
      - run:
          name: Print versions
          command: |
            cargo --version
            rustc --version
      - run:
          name: Generate lockfile
          command: cargo generate-lockfile
      - restore_cache:
          keys:
            - cargo-v1-{{ arch }}-{{ checksum "Cargo.lock" }}
            - cargo-v1-{{ arch }}
      - run:
          name: Build debug
          command: cargo build --locked
      - run:
          name: Run tests
          command: cargo test --locked --verbose --no-fail-fast
      - run:
          name: Build release
          command: cargo build --locked --release
      - run:
          name: Build benchmarks
          command: cargo bench --locked --no-run
      - run:
          name: Run linter
          command: cargo clippy --locked --no-deps
      - run:
          name: Run format check
          command: cargo fmt --check
      - run:
          name: Build docs
          command: cargo rustdoc --locked --all-features -- --extend-css custom.css
      - save_cache:
          key: cargo-v1-{{ arch }}-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry/index
            - ~/.cargo/registry/cache
            - ~/.cargo/git/db
  
  build-macos-m4:
    resource_class:
      m4pro.medium
    macos:
      xcode: 26.4.1
    steps:
      - checkout
      - run:
          name: Download rustup
          command: curl -o rustup https://sh.rustup.rs
      - run:
          name: Install rust toolchain
          command: |
            bash rustup -y --verbose
            source ~/.cargo/env
            cargo --version
            rustc --version
      - run:
          name: Generate lockfile
          command: cargo generate-lockfile
      - restore_cache:
          keys:
            - cargo-v1-{{ arch }}-{{ checksum "Cargo.lock" }}
            - cargo-v1-{{ arch }}
      - run:
          name: Build debug
          command: cargo build --locked
      - run:
          name: Run tests
          command: cargo test --locked --verbose --no-fail-fast
      - run:
          name: Build release
          command: cargo build --locked --release
      - run:
          name: Build benchmarks
          command: cargo bench --locked --no-run
      - run:
          name: Run linter
          command: cargo clippy --locked --no-deps
      - run:
          name: Run format check
          command: cargo fmt --check
      - run:
          name: Build docs
          command: cargo rustdoc --locked --all-features -- --extend-css custom.css
      - save_cache:
          key: cargo-v1-{{ arch }}-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry/index
            - ~/.cargo/registry/cache
            - ~/.cargo/git/db

  build-windows-x86:
    executor:
      name: windows/default
    steps:
      - checkout
      - run:
          name: Remove default rust
          # The machine-installed rust uses GNU-ABI toolchain and sits earlier on PATH
          # than rustup's .cargo\bin, so it would shadow the MSVC toolchain installed below.
          command: |
            choco uninstall rust rust-ms -y --skip-autouninstaller
            exit 0
      - run:
          name: Download rustup
          command: curl.exe -sSfLo rustup-init.exe https://win.rustup.rs/x86_64
      - run:
          name: Install rust toolchain
          command: |
            .\rustup-init.exe -y --default-host x86_64-pc-windows-msvc `
                                 --default-toolchain 1.98 --profile minimal `
                                 --component clippy --component rustfmt
            $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"
      - run:
          name: Print versions
          command: |
            Get-Command cargo, rustc | Select-Object Name, Source
            cargo -vV
            rustc -vV
      - run:
          name: Generate lockfile
          command: cargo generate-lockfile
      - restore_cache:
          keys:
            - cargo-v1-{{ arch }}-{{ checksum "Cargo.lock" }}
            - cargo-v1-{{ arch }}
      - run:
          name: Build debug
          command: cargo build --locked
      - run:
          name: Run tests
          command: cargo test --locked --verbose --no-fail-fast
      - run:
          name: Build release
          command: cargo build --locked --release
      - run:
          name: Build benchmarks
          command: cargo bench --locked --no-run
      - run:
          name: Run linter
          command: cargo clippy --locked --no-deps
      - run:
          name: Run format check
          command: cargo fmt --check
      - run:
          name: Build docs
          command: cargo rustdoc --locked --all-features -- --extend-css custom.css
      - save_cache:
          key: cargo-v1-{{ arch }}-{{ checksum "Cargo.lock" }}
          paths:
            - .cargo\registry\index
            - .cargo\registry\cache
            - .cargo\git\db

workflows:
  build-all:
    jobs:
      - build-linux-x86
      - build-macos-m4
      - build-windows-x86
