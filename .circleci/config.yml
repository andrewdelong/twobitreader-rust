version: 2.1

orbs:
  windows: circleci/windows@5

jobs:
  build-linux-x86:
    resource_class:
      large
    docker:
      - image: cimg/rust:1.98
    steps:
      - checkout
      - run:
          name: Print versions
          command: |
            cargo --version
            rustc --version
            rustup --version
      - run:
          name: Generate lockfile
          command: cargo generate-lockfile
      - restore_cache:
          name: Restore cache
          keys:
            - cargo-v0-linux-{{ arch }}-{{ checksum "Cargo.lock" }}
            - cargo-v0-linux-{{ arch }}
      - run:
          name: Build debug
          command: cargo build
      - run:
          name: Run tests
          command: cargo test --verbose --no-fail-fast
      - run:
          name: Build release
          command: cargo build --release
      - run:
          name: Build benchmarks
          command: cargo bench --no-run
      - run:
          name: Run linter
          command: cargo clippy --no-deps
      - run:
          name: Run format check
          command: cargo fmt --check
      - run:
          name: Build docs
          command: cargo rustdoc -- --extend-css custom.css
      - save_cache:
          name: Save cache
          key: cargo-v0-linux-{{ arch }}-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - target/debug/.fingerprint
            - target/debug/build
            - target/debug/deps
            - target/release/.fingerprint
            - target/release/build
            - target/release/deps
            - target/.rustdoc_fingerprint.json
            - target/doc
            - tests/assets/hg38.p13.2bit

  build-macos-m4:
    resource_class:
      m4pro.medium
    macos:
      xcode: 26.4.1
    steps:
      - checkout
      - run:
          name: Download rustup
          command: curl -o rustup https://sh.rustup.rs
      - run:
          name: Install rust toolchain
          command: |
            bash rustup -y --verbose
            source ~/.cargo/env
            cargo --version
            rustc --version
            rustup --version
      - run:
          name: Generate lockfile
          command: cargo generate-lockfile
      - restore_cache:
          name: Restore cache
          keys:
            - cargo-v0-macos-{{ arch }}-{{ checksum "Cargo.lock" }}
            - cargo-v0-macos-{{ arch }}
      - run:
          name: Build debug
          command: cargo build
      - run:
          name: Run tests
          command: cargo test --verbose --no-fail-fast
      - run:
          name: Build release
          command: cargo build --release
      - run:
          name: Build benchmarks
          command: cargo bench --no-run
      - run:
          name: Run linter
          command: cargo clippy --no-deps
      - run:
          name: Run format check
          command: cargo fmt --check
      - run:
          name: Build docs
          command: cargo rustdoc -- --extend-css custom.css
      - save_cache:
          name: Save cache
          key: cargo-v0-macos-{{ arch }}-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - target/debug/.fingerprint
            - target/debug/build
            - target/debug/deps
            - target/release/.fingerprint
            - target/release/build
            - target/release/deps
            - target/.rustdoc_fingerprint.json
            - target/doc
            - tests/assets/hg38.p13.2bit

  build-windows-x86:
    executor:
      name: windows/default
    shell: cmd.exe /c
    steps:
      - checkout
      - run:
          name: Download rustup
          command: curl.exe -sSfLo rustup-init.exe https://win.rustup.rs/x86_64
      - run:
          name: Install rust toolchain
          command: |
            .\rustup-init.exe -y --default-host x86_64-pc-windows-msvc \
                                 --default-toolchain 1.98 --profile minimal \
                                 --component clippy --component rustfmt
            cargo --version
            rustc --version
            rustup --version
      - run:
          name: Generate lockfile
          command: cargo generate-lockfile
      - restore_cache:
          name: Restore cache
          keys:
            - cargo-v0-windows-{{ arch }}-{{ checksum "Cargo.lock" }}
            - cargo-v0-windows-{{ arch }}
      - run:
          name: Build debug
          command: cargo build
      - run:
          name: Run tests
          command: cargo test --verbose --no-fail-fast
      - run:
          name: Build release
          command: cargo build --release
      - run:
          name: Build benchmarks
          command: cargo bench --no-run
      - run:
          name: Run linter
          command: cargo clippy --no-deps
      - run:
          name: Run format check
          command: cargo fmt --check
      - run:
          name: Build docs
          command: cargo rustdoc -- --extend-css custom.css
      - save_cache:
          name: Save cache
          key: cargo-v0-windows-{{ arch }}-{{ checksum "Cargo.lock" }}
          paths:
            - .cargo\registry
            - target\debug\.fingerprint
            - target\debug\build
            - target\debug\deps
            - target\release\.fingerprint
            - target\release\build
            - target\release\deps
            - target\.rustdoc_fingerprint.json
            - target\doc
            - tests\assets\hg38.p13.2bit

workflows:
  build-all:
    jobs:
      - build-linux-x86
      - build-macos-m4
      - build-windows-x86
