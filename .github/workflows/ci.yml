name: CI
on: [push, pull_request]
concurrency: { group: "${{ github.ref }}", cancel-in-progress: true }
defaults: { run: { shell: bash } }

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, macos-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.98
        with:
          components: clippy, rustfmt
      - run: cargo generate-lockfile
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --verbose
      - run: cargo test --locked --verbose --no-fail-fast
      - run: cargo build --locked --verbose --release
      - run: cargo bench --locked --verbose --no-run
      - run: cargo clippy --locked --all-features --no-deps
      - run: cargo fmt --check
      - run: cargo rustdoc --locked --all-features -- --extend-css custom.css
      # Python wrapper: build a wheel and run tests against the installed extension
      - uses: actions/setup-python@v5
        with: { python-version: "3.9" }
      - run: pip install maturin pytest
      - run: maturin build --release --out dist
      - run: pip install --no-index --find-links dist twobitreader_rs
      - run: pytest tests/test_twobitreader_rs -q
